<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ETLAB - Faculty Attendance</title>

    <link rel="stylesheet" href="css/faculty-attendance.css">
</head>

<body>

<header class="header">

    <div>
        <h1>TKM College of Engineering</h1>
        <p>Faculty Attendance</p>
    </div>

    <div>
        <span id="facultyName">Faculty</span>
        <button onclick="goBack()">Dashboard</button>
    </div>

</header>


<main class="container">

    <h2>Mark Attendance</h2>


    <section class="controls">

        <div>
            <label>Date</label>

            <input
                type="date"
                id="attendanceDate"
            >
        </div>


        <div>
            <label>Class</label>

            <select id="classSelect">

                <option value="">
                    Select Class
                </option>

            </select>
        </div>


        <div>
            <label>Subject</label>

            <select
                id="subjectSelect"
                disabled
            >

                <option value="">
                    Select Subject
                </option>

            </select>
        </div>


        <div>
            <label>Period</label>

            <select id="periodSelect">

                <option value="1">Period 1</option>
                <option value="2">Period 2</option>
                <option value="3">Period 3</option>
                <option value="4">Period 4</option>
                <option value="5">Period 5</option>
                <option value="6">Period 6</option>
                <option value="7">Period 7</option>
                <option value="8">Period 8</option>

            </select>
        </div>

    </section>


    <section class="topic-section">

        <label>Topic Taught</label>

        <input
            type="text"
            id="topicInput"
            placeholder="Enter the topic taught in this period"
        >

    </section>


    <section class="students-section">

        <div class="section-header">

            <h3>Students</h3>

            <div>

                <button onclick="markAll('present')">
                    All Present
                </button>

                <button onclick="markAll('absent')">
                    All Absent
                </button>

            </div>

        </div>


        <table>

            <thead>

                <tr>
                    <th>Roll No.</th>
                    <th>Register Number</th>
                    <th>Name</th>
                    <th>Attendance</th>
                </tr>

            </thead>

            <tbody id="studentBody">

                <tr>

                    <td colspan="4">
                        Select a class first
                    </td>

                </tr>

            </tbody>

        </table>

    </section>


    <button
        id="saveButton"
        class="save-button"
        onclick="saveAttendance()"
        disabled
    >
        SAVE ATTENDANCE
    </button>


    <p id="message"></p>

</main>


<script src="js/faculty-attendance.js"></script>

</body>
</html>
